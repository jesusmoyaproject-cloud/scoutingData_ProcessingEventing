# configs/inference_cloud.yaml
# Configuración optimizada para ejecución en nube (Colab / Kaggle L4 / T4 GPU)
# Soporta format: "engine" (TensorRT) o "pt" (PyTorch FP16)

environment: "COLAB"
headless: true
compact_json: true
device: "cuda"
format: "engine" # Cambiar a "engine" una vez compilados los modelos en models/
half: true

models:
  player: "models/modelPlayer.engine"       # o "models/modelPlayer.engine"
  ball: "models/modelBall.engine"           # o "models/modelBall.engine"
  keypoints: "models/modelKeypoint.engine"  # o "models/modelKeypoint.engine"

data:
  input_video: "/content/input.mp4"
  output_video: "/content/outputs/scouting_output.mp4"
  output_json: "/content/outputs/tracking_output.json"
  output_csv: "/content/outputs/events_output.csv"
  output_metadata: "/content/outputs/match_metadata.json"
  rejections_csv: "/content/outputs/rejections_output.csv"
  keypoints_audit_csv: "/content/outputs/keypoints_audit.csv"

homography:
  interval: 6

tracking:
  player_stride: 2

stream:
  max_width: 1920
  use_threaded_reader: true
  reader_buffer_size: 128
  use_async_writer: false
