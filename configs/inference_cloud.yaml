# configs/inference_cloud.yaml
# Configuración optimizada para ejecución en nube (Colab / Kaggle T4 GPU / PyTorch CUDA)

environment: "COLAB"
headless: true
device: "cuda"
format: "pt"
half: true

models:
  player: "models/modelPlayer.pt"
  ball: "models/modelBall.pt"
  keypoints: "models/modelKeypoint.pt"

data:
  input_video: "/content/input.mp4"
  output_video: "/content/outputs/scouting_output.mp4"
  output_json: "/content/outputs/tracking_output.json"
  output_csv: "/content/outputs/events_output.csv"
  output_metadata: "/content/outputs/match_metadata.json"
  rejections_csv: "/content/outputs/rejections_output.csv"
  keypoints_audit_csv: "/content/outputs/keypoints_audit.csv"

homography:
  interval: 3

tracking:
  player_stride: 1

stream:
  max_width: 1920
  use_threaded_reader: true
  reader_buffer_size: 128
  use_async_writer: false
