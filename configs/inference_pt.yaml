# configs/inference_pt.yaml
# Configuracion optimizada para ejecucion directa con modelos PyTorch (.pt)
# Compatible con Google Colab (GPU CUDA T4/L4) y ejecucion local

environment: "COLAB"
headless: false
compact_json: true
device: "cuda"      # Cambiar a "cpu" si se corre localmente sin GPU
format: "pt"        # PyTorch nativo (.pt)
half: true          # FP16 en GPU CUDA para maxima aceleracion

models:
  player: "models/modelPlayer.pt"
  ball: "models/modelBall.pt"
  keypoints: "models/modelKeypoint.pt"

data:
  input_video: "/content/input.mp4"
  output_video: null
  output_json: "/content/outputs/tracking_output.json"
  output_csv: "/content/outputs/events_output.csv"
  output_metadata: "/content/outputs/match_metadata.json"
  rejections_csv: "/content/outputs/rejections_output.csv"
  keypoints_audit_csv: "/content/outputs/keypoints_audit.csv"

homography:
  interval: 6

tracking:
  player_stride: 2

stream:
  max_width: 1920
  use_threaded_reader: true
  reader_buffer_size: 128
  use_async_writer: true
