# BoT-SORT Evolucionado (UKF + DIoU Tracker) optimizado para análisis de fútbol (ScoutingData)
# Cinemática no lineal mediante Unscented Kalman Filter (puntos sigma) y asociación geométrica DIoU.

tracker_type: botsort

# Umbrales de detección y asociación
track_high_thresh: 0.50    # Detecciones primarias de alta confianza (filtrado estricto)
track_low_thresh: 0.20     # Detecciones secundarias para recuperación tras oclusiones
new_track_thresh: 0.55     # Umbral para inicializar una nueva trayectoria
track_buffer: 45           # Buffer de 45 frames (1.5s a 30 FPS) para retener jugadores temporalmente ocultos
match_thresh: 0.80         # Umbral de costo de asociación DIoU (1 - DIoU)
fuse_score: True           # Fusionar score de detección con movimiento

# Parámetros requeridos por Ultralytics BoT-SORT
proximity_thresh: 0.5
appearance_thresh: 0.8
model: auto
gmc_method: none
with_reid: False

# Parámetros cinemáticos UKF (utilizados por UKFBoTSORTTracker)
ukf:
  alpha: 0.001
  beta: 2.0
  kappa: 0.0
  motion_model: "CTRV"     # Constant Turn Rate and Velocity
